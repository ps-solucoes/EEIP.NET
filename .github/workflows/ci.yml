name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EEIP.NET.slnx

      - name: Build (library, examples, tests)
        run: dotnet build EEIP.NET.slnx -c Release --no-restore

      - name: Test
        run: dotnet test EEIP.NET.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore

  aot:
    name: Native AOT smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish example with Native AOT
        shell: bash
        run: |
          set -o pipefail
          dotnet publish DiscoverDevices/DiscoverDevices.csproj -c Release -r linux-x64 \
            -p:PublishAot=true -o aot-out 2>&1 | tee publish.log
          if grep -E 'warning IL[0-9]{4}' publish.log; then
            echo "::error::Trim/AOT warnings found; EEIP is declared IsAotCompatible"
            exit 1
          fi
          test -x aot-out/DiscoverDevices

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack EEIP.NET/EEIP.csproj -c Release -o nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkg/*.nupkg
