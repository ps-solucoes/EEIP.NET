name: Publish NuGet (GitHub Packages)

on:
  release:
    types: [released]   # fires only on published, non-prerelease releases

permissions:
  contents: write   # upload the .snupkg as a release asset
  packages: write   # push the .nupkg to GitHub Packages

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: EEIP.NET/EEIP.csproj

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # A release always carries a tag, so there is no fallback to the <Version> in the csproj:
      # a tag that is not vX.Y.Z[-pre][+meta] fails here instead of shipping a mislabelled package.
      - name: Derive version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Release tag '$GITHUB_REF_NAME' does not resolve to a valid SemVer version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore EEIP.NET.slnx

      - name: Build
        run: dotnet build EEIP.NET.slnx -c Release --no-restore -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true

      # Never ship a package the tests reject, even if CI on the tag push has not finished yet.
      - name: Test
        run: dotnet test EEIP.NET.slnx -c Release --no-build

      # Not --no-build: the tested build carries InternalsVisibleTo for the test project, so the
      # library is recompiled without it for the package.
      - name: Pack
        run: |
          dotnet pack "$PROJECT" -c Release --no-restore \
            -p:Version="$VERSION" \
            -p:ContinuousIntegrationBuild=true \
            -p:ExposeInternalsToTests=false \
            -o "$RUNNER_TEMP/nupkg"
          ls -l "$RUNNER_TEMP/nupkg"

      - name: Verify package contents
        run: .github/scripts/verify-package.sh "$RUNNER_TEMP/nupkg"

      - name: Push package to GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        # GitHub Packages rejects .snupkg, so push only the .nupkg here.
        run: >
          dotnet nuget push "$RUNNER_TEMP/nupkg/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate

      - name: Attach symbols (.snupkg) to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Symbol packages can't live on the feed; ship them as release assets for step-into debugging.
        run: gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/nupkg/*.snupkg --clobber
